    <main>
        <section id="contact-form">
            <h2>Contact Us</h2>
            <form action="submit_form.php" method="POST">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <fieldset>
                    <legend>What is your message about?</legend>
                    <label><input type="radio" name="purpose" value="general"> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="booking"> Booking Request</label>
                    <label><input type="radio" name="purpose" value="other"> Other</label>
                </fieldset>

                <button type="submit">Send Message</button>
            </form>
        </section>
